name: Scheduled security monitoring

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: signalforge-security-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Validate monitor configuration
        env:
          APP_URL: ${{ vars.SIGNALFORGE_APP_URL }}
          MONITOR_SECRET: ${{ secrets.SECURITY_MONITOR_SECRET }}
        run: |
          test -n "$APP_URL" || { echo "Missing repository variable SIGNALFORGE_APP_URL"; exit 1; }
          test -n "$MONITOR_SECRET" || { echo "Missing repository secret SECURITY_MONITOR_SECRET"; exit 1; }
          case "$APP_URL" in https://*) ;; *) echo "SIGNALFORGE_APP_URL must use HTTPS"; exit 1 ;; esac

      - name: Run security monitor
        env:
          APP_URL: ${{ vars.SIGNALFORGE_APP_URL }}
          MONITOR_SECRET: ${{ secrets.SECURITY_MONITOR_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $MONITOR_SECRET" \
            --header "Content-Type: application/json" \
            --max-time 60 \
            "$APP_URL/api/internal/security-monitor"
