name: Render README dashboard previews

on:
  push:
    paths:
      - "docs/images/*.svg"
      - "scripts/render-dashboard-previews.py"
      - ".github/workflows/render-dashboard-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-preview-renders
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check CairoSVG==2.7.1

      - name: Render SVG previews as PNG
        run: python scripts/render-dashboard-previews.py

      - name: Commit generated PNG previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/*.svg docs/images/*.png
          if git diff --cached --quiet; then
            echo "Dashboard PNG previews are already up to date."
            exit 0
          fi
          git commit -m "chore(docs): render dashboard previews as PNG"
          git push origin HEAD:main
